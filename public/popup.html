<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="./blank.css" />
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-items: center;
      white-space: nowrap;
      padding: 12px;
    }
    fieldset {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin: 0;
      padding: 0;
      border: 0;
    }
    legend {
      padding: 0;
      margin-bottom: 12px;
      color: #605e5c;
      font-size: 12px;
    }
    .status {
      margin-left: auto;
      padding-left: 16px;
      color: #605e5c;
      font-size: 12px;
      font-weight: 400;
    }
    .status.ok {
      color: #107c10;
    }
    .status.error {
      color: #a4262c;
    }
    .row {
      display: flex;
      gap: 16px;
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 15px;
    }
    .hint {
      margin: 8px 0 0;
      color: #605e5c;
      font-size: 12px;
    }
    .hint .link {
      margin-left: 8px;
      font-size: 12px;
    }
    .link {
      color: #0078d4;
    }
    .link:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <input id="UISwitch" type="checkbox">
  <label for="UISwitch">全新 UI</label>
  <br>
  <input id="globalSwitch" type="checkbox">
  <label for="globalSwitch">全局</label>
  <br>

  <fieldset id="site">
    <legend>当前站点</legend>
    <div class="row">
      <input id="site-follow" name="site" type="radio" value="follow">
      <label for="site-follow">跟随全局</label>
      <input id="site-on" name="site" type="radio" value="on">
      <label for="site-on">开启</label>
      <input id="site-off" name="site" type="radio" value="off">
      <label for="site-off">关闭</label>
    </div>
  </fieldset>
  <p id="fileHint" class="hint" hidden>
    本地文件需要开启“允许访问文件 URL”<a id="openDetails" class="link">去开启</a>
  </p>
  <br>

  <fieldset>
    <legend>翻译引擎</legend>
    <input id="engine-volcengine" name="engine" type="radio" value="volcengine">
    <label for="engine-volcengine">火山翻译<span class="status"></span></label>
    <input id="engine-transmart" name="engine" type="radio" value="transmart">
    <label for="engine-transmart">腾讯交互翻译<span class="status"></span></label>
    <input id="engine-bing" name="engine" type="radio" value="bing">
    <label for="engine-bing">必应翻译<span class="status"></span></label>
    <input id="engine-agent" name="engine" type="radio" value="agent">
    <label for="engine-agent">Agent 翻译<span class="status"></span></label>
  </fieldset>
  <div class="actions">
    <button id="testEngines">测试连通</button>
    <a id="openOptions" class="link">Agent 设置</a>
    <a id="openPdf" class="link" title="在内置阅读器里打开 PDF, 选中文字即可翻译">PDF 翻译</a>
  </div>
  <br>

  <button id="shortcut" title="点击自定义快捷键">Ctrl+Alt</button>

  <script type="module" src="./popup.js"></script>
</body>
